# Nginx reverse proxy for ECC Sheet
#
# Drop this file in /etc/nginx/sites-available/ecc-sheet and symlink it to
# /etc/nginx/sites-enabled/ecc-sheet. Obtain a TLS certificate first, for
# example with Certbot: certbot --nginx -d ecc.example.edu
#
# Two auth modes are shown. Use ONE of them:
#   A) Proxy-header auth   – authenticate at the proxy layer; pass the
#                            username via X-Auth-User. Set
#                            AUTH_PROXY_USERNAME_HEADER=X-Auth-User in .env.
#   B) App-managed SAML    – let the Flask app handle SAML itself. Do NOT
#                            inject X-Auth-User. Set SAML_ENABLED=true in .env.
#
# After editing, test and reload:
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name ecc.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ecc.example.edu;

    ssl_certificate     /etc/letsencrypt/live/ecc.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecc.example.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- MODE A: Proxy-header auth -------------------------------------------
    # Uncomment the auth_basic block and the X-Auth-User header below.
    # Replace the htpasswd path with your actual credentials file.
    #
    # auth_basic           "ECC Sheet";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_redirect     off;

        # Strip any client-supplied auth or forwarding headers before setting ours.
        proxy_set_header   X-Auth-User         "";
        proxy_set_header   X-Forwarded-For     "";
        proxy_set_header   X-Real-IP           "";

        # Standard forwarding headers (required for correct URL generation and
        # SAML SP metadata; the app reads these to build absolute URLs).
        proxy_set_header   Host                $host;
        proxy_set_header   X-Forwarded-Host    $host;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_set_header   X-Forwarded-Port    $server_port;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;

        # --- MODE A: inject authenticated username ---------------------------
        # auth_basic must be active above for this to be trustworthy.
        # proxy_set_header X-Auth-User $remote_user;

        proxy_read_timeout 60s;
    }
}
