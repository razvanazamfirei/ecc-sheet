[project]
name = "ecc-sheet"
version = "1.0.0"
description = "ECC Sheet automation with Flask"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "flask-sqlalchemy>=3.1.1",
  "flask-wtf>=1.2.1",
  "wtforms>=3.1.1",
  "apscheduler>=3.10.4",
  "python-dotenv>=1.0.0",
  "email-validator>=2.1.0",
  "pytz>=2024.1",
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "requests>=2.31.0",
  "flask-migrate>=4.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
