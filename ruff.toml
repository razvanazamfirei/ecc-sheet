indent-width = 4
line-length = 88
target-version = "py313"

[lint]
fixable = ["ALL"]
ignore = [
  "PLR2004", # Magic value comparisons
  "S104",    # Binding to all interfaces (acceptable in dev)
  "S201",    # Flask debug mode (acceptable in dev)
]
preview = true
select = [
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "FLY",
  "FURB",
  "G",
  "I",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]

[lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",    # Use of assert in tests is expected
  "PLR6301", # Test methods don't need to be static
  "PLC0415", # Imports in test functions is acceptable
  "DTZ001",  # Naive datetime in tests is acceptable (using pytz.localize)
]
"tests/conftest.py" = [
  "E402", # Imports after env-var setup (intentional: env vars must precede Flask import)
]
"scripts/*.py" = [
  "S104", # Binding to all interfaces acceptable in scripts
  "S201", # Debug mode acceptable in scripts
]
"backend/holidays.py" = [
  "PLC0415", # Deferred import to break models ↔ holidays circular import
]
".claude/hooks/*.py" = [
  "PLR0913",
]
[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
