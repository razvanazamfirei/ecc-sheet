[tools]
python = "3.13"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = [
  "--system-site-packages",
  "--seed",
] }
FLASK_APP = "backend.app"

[tasks.setup]
description = "Initial project setup"
run = ["uv sync", "bun install", "bun run build", "uv run flask db upgrade"]

[tasks."dev:frontend"]
description = "Run frontend watcher"
run = "bun run dev"

[tasks."dev:backend"]
description = "Run Flask development server"
run = "uv run python -m backend.app"

[tasks.dev]
description = "Run development server (builds frontend first, then run 'mise run dev:frontend' and 'mise run dev:backend' in separate terminals)"
run = "bun run build && uv run python -m backend.app"

[tasks.test]
description = "Run tests"
run = "uv run pytest tests/ -v"

[tasks.build]
description = "Build frontend"
run = "bun run build"

[tasks.migrate]
description = "Run database migrations"
run = "uv run flask db upgrade"
